server:
  port: 8003
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

spring:
  application:
    name: light-reading-cloud-account

  # Nacos 配置中心和注册中心
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
        refresh: true
        shared-dataids: reading-cloud-account.yml
        group: DEFAULT_GROUP
      discovery:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP

  datasource:
    account-center:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/reading_cloud_account?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
      username: root
      password: '123456'
      initial-size: 5
      min-idle: 5
      max-active: 30
      max-wait: 6000
      test-while-idle: true
      validation-query: 'select 1 from dual'
      connect-timeout: 1500

  redis:
    database: 0
    host: localhost
    port: 6379
    password:

  thread-pool:
    common:
      corePoolSize: 1
      maximumPoolSize: 5
      keepAliveTime: 0
      queueCapacity: 20480
    bookshelf:
      corePoolSize: 1
      maximumPoolSize: 3
      keepAliveTime: 0
      queueCapacity: 10240

  feign:
    okhttp:
      enabled: true
    hystrix:
      enabled: true
    compression:
      request:
        enabled: true
        mime-type: text/html,application/xml,application/json
        min-request-size: 1024
      response:
        enabled: true

hystrix:
  threadpool:
    default:
      coreSize: 20
      maxQueueSize: 1000
      queueSizeRejectionThreshold: 400
