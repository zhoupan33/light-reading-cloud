server:
  port: 8001

spring:
  application:
    name: light-reading-cloud-book

  # Nacos 配置中心和注册中心
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
        refresh: true
        shared-dataids: reading-cloud-book.yml
        group: DEFAULT_GROUP
      discovery:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP

  datasource:
    book-center:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/reading_cloud_resource?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
      username: root
      password: '123456'
      initial-size: 5
      min-idle: 5
      max-active: 30
      max-wait: 6000
      test-while-idle: true
      validation-query: 'select 1 from dual'
      connect-timeout: 1500

  redis:
    database: 0
    host: localhost
    port: 6379
    password:

# Hystrix 配置
hystrix:
  threadpool:
    default:
      coreSize: 20
      maxQueueSize: 1000
      queueSizeRejectionThreshold: 400